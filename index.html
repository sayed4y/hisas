<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دفتر الحصص الذكي</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="دفتر الحصص">
  <meta name="theme-color" content="#1e293b">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- مكتبات Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 70px; }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 20px 16px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .app-title { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .cloud-status {
      font-size: 0.72rem;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .header-btns { display: flex; gap: 8px; }
    .btn-header {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .search-box {
      width: 100%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 9px 12px;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }
    .search-box::placeholder { color: rgba(255,255,255,0.65); }

    .container { max-width: 900px; margin: 0 auto; padding: 14px; }
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
    .tab-btn {
      background: white;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .students-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
    }
    .card.ready-for-billing { border: 2px solid var(--success); background: #f0fdf4; }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .student-name { font-size: 1.15rem; font-weight: 700; color: var(--text); }
    .student-grade { font-size: 0.82rem; color: var(--text-muted); }
    .badge-price { background: #eff6ff; color: var(--primary); padding: 4px 8px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; }

    .cycle-steps { display: flex; flex-wrap: wrap; margin: 10px 0 14px; gap: 6px; }
    .step-item {
      flex: 1 1 calc(25% - 6px);
      min-width: 65px;
      height: 36px;
      border-radius: 8px;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .step-item.completed { background: #dcfce7; color: var(--success); border: 1.5px solid var(--success); }
    .step-item.current { border: 2px dashed var(--primary); color: var(--primary); background: #eff6ff; }

    .sessions-list { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 8px; margin-bottom: 12px; font-size: 0.78rem; }
    .session-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px; border-bottom: 1px solid #edf2f7; }
    .session-row:last-child { border-bottom: none; }

    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn-record { background: var(--primary); color: white; }
    .btn-whatsapp { background: #25D366; color: white; }
    .btn-reset { background: var(--surface); color: var(--success); border: 1.5px solid var(--success); }
    .btn-undo { background: transparent; color: var(--danger); font-size: 0.78rem; border: none; text-decoration: underline; cursor: pointer; text-align: center; }

    .fab-add {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      box-shadow: 0 4px 14px rgba(37,99,235,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      z-index: 20;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 20px; width: 100%; max-width: 420px; padding: 20px; }
    .modal-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; outline: none; }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div>
        <div class="app-title"><span>📚</span> دفتر الحصص الذكي</div>
        <div id="cloudBadge" class="cloud-status">☁️ مزامنة سحابية نشطة</div>
      </div>
      <div class="header-btns">
        <button class="btn-header" onclick="openPaymentSettings()">💳 بيانات الدفع</button>
        <button class="btn-header" onclick="exportData()">💾 نسخة احتياطية</button>
      </div>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم الطالب..." oninput="renderStudents()">
  </header>

  <div class="container">
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="setFilter('all', this)">كل الطلاب</button>
      <button class="tab-btn" onclick="setFilter('ready', this)">مطلوب الحساب 🟢</button>
      <button class="tab-btn" onclick="setFilter('in-progress', this)">خالص الحساب (0) ⏳</button>
    </div>
    <div class="students-grid" id="studentsList"></div>
  </div>

  <button class="fab-add" onclick="openAddStudentModal()" title="إضافة طالب">+</button>

  <!-- نافذة تسجيل حصة -->
  <div class="modal" id="recordSessionModal">
    <div class="modal-content">
      <h3 class="modal-title" id="recordModalTitle">تسجيل حصة</h3>
      <div class="form-group"><label>رقم الحصة</label><input type="text" id="mSessionNum" readonly style="background:#f1f5f9; font-weight:700;"></div>
      <div class="form-group"><label>التاريخ</label><input type="date" id="mSessionDate"></div>
      <div style="display:flex; gap:8px;">
        <div class="form-group" style="flex:1;"><label>البداية</label><input type="time" id="mStartTime"></div>
        <div class="form-group" style="flex:1;"><label>النهاية</label><input type="time" id="mEndTime"></div>
      </div>
      <div class="form-group"><label>سعر الحصة (جنيه)</label><input type="number" id="mSessionPrice"></div>
      <div class="modal-actions">
        <button class="btn btn-record" onclick="confirmSaveSession()">حفظ الحصة</button>
        <button class="btn" style="background:#e2e8f0; color:#333;" onclick="closeModal('recordSessionModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة إضافة وتعديل طالب -->
  <div class="modal" id="studentModal">
    <div class="modal-content">
      <h3 class="modal-title" id="studentModalTitle">إضافة طالب</h3>
      <div class="form-group"><label>اسم الطالب</label><input type="text" id="sName" placeholder="اسم الطالب"></div>
      <div class="form-group"><label>المرحلة الدراسية</label><input type="text" id="sGrade" placeholder="مثال: 3 ثانوي"></div>
      <div class="form-group"><label>رقم ولي الأمر (واتساب)</label><input type="tel" id="sPhone" placeholder="010XXXXXXXX"></div>
      <div class="form-group"><label>سعر الحصة الافتراضي</label><input type="number" id="sPrice" placeholder="150"></div>
      <div class="modal-actions">
        <button class="btn btn-record" id="btnSaveStudentText" onclick="saveStudent()">حفظ</button>
        <button class="btn" style="background:#e2e8f0; color:#333;" onclick="closeModal('studentModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة بيانات الدفع -->
  <div class="modal" id="paymentSettingsModal">
    <div class="modal-content">
      <h3 class="modal-title">بيانات التحويل المسجلة</h3>
      <div class="form-group"><label>فودافون كاش</label><input type="text" id="cfgVodafone" placeholder="010XXXXXXXX"></div>
      <div class="form-group"><label>إنستاباي (InstaPay)</label><input type="text" id="cfgInstapay" placeholder="username@instapay"></div>
      <div class="modal-actions">
        <button class="btn btn-record" onclick="savePaymentSettings()">حفظ</button>
        <button class="btn" style="background:#e2e8f0; color:#333;" onclick="closeModal('paymentSettingsModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAmkc6M0fVxgVNSaTzjdX0OQ2TIrshh3wM",
      authDomain: "hisas-592eb.firebaseapp.com",
      projectId: "hisas-592eb",
      storageBucket: "hisas-592eb.firebasestorage.app",
      messagingSenderId: "435524902026",
      appId: "1:435524902026:web:bb44603bfa06468da3e173"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let students = [];
    let paymentInfo = { vodafone: '', instapay: '' };
    let currentFilter = 'all';
    let activeStudentIdForSession = null;
    let editingStudentId = null;

    // استماع لحظي لكل طالب كوثيقة مستقلة
    db.collection('students').onSnapshot(snapshot => {
      students = [];
      snapshot.forEach(doc => {
        students.push({ id: doc.id, ...doc.data() });
      });
      students.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
      document.getElementById('cloudBadge').innerText = '☁️ متزامن (' + students.length + ' طالب)';
      renderStudents();
    });

    // استماع لبيانات الدفع من السيرفر
    db.collection('settings').doc('payment').onSnapshot(doc => {
      if (doc.exists) paymentInfo = doc.data();
    });

    function formatTime12h(timeStr) {
      if (!timeStr) return '';
      let [h, m] = timeStr.split(':').map(Number);
      const period = h >= 12 ? 'م' : 'ص';
      h = h % 12 || 12;
      return `${h}:${m < 10 ? '0' + m : m} ${period}`;
    }

    function formatDateFriendly(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return d.toLocaleDateString('ar-EG', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      renderStudents();
    }

    function renderStudents() {
      const list = document.getElementById('studentsList');
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      list.innerHTML = '';

      let filtered = students.filter(s => {
        const matchSearch = (s.name || '').toLowerCase().includes(search) || (s.grade || '').toLowerCase().includes(search);
        const count = s.sessions ? s.sessions.length : 0;
        if (!matchSearch) return false;
        if (currentFilter === 'ready') return count > 0;
        if (currentFilter === 'in-progress') return count === 0;
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:30px; color:var(--text-muted);">لا يوجد طلاب حالياً. اضغط (+) لإضافة طالب جديد.</div>`;
        return;
      }

      filtered.forEach(s => {
        const count = s.sessions ? s.sessions.length : 0;
        const totalDue = s.sessions ? s.sessions.reduce((acc, cur) => acc + Number(cur.price || s.defaultPrice || 0), 0) : 0;

        const card = document.createElement('div');
        card.className = `card ${count > 0 ? 'ready-for-billing' : ''}`;

        let stepsHtml = '';
        if (count === 0) {
          stepsHtml = `<div class="step-item current">الحصة 1 (التالية)</div>`;
        } else {
          for (let i = 1; i <= count; i++) {
            stepsHtml += `<div class="step-item completed">✓ حصة ${i}</div>`;
          }
          stepsHtml += `<div class="step-item current">+ حصة ${count + 1}</div>`;
        }

        let sessionsDetailsHtml = '';
        if (s.sessions && s.sessions.length > 0) {
          sessionsDetailsHtml = `<div class="sessions-list">`;
          s.sessions.forEach(sess => {
            sessionsDetailsHtml += `
              <div class="session-row">
                <b>حصة ${sess.num}</b>
                <span>📅 ${formatDateFriendly(sess.date)}</span>
                <span style="direction:ltr;">${formatTime12h(sess.startTime)} - ${formatTime12h(sess.endTime)}</span>
                <b>${sess.price} ج</b>
              </div>
            `;
          });
          sessionsDetailsHtml += `</div>`;
        }

        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="student-name">${s.name}</div>
              <div class="student-grade">${s.grade || 'طالب'}</div>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              <div class="badge-price">${s.defaultPrice} ج</div>
              <button onclick="openEditStudentModal('${s.id}')" style="background:#f1f5f9; border:none; padding:4px 8px; border-radius:6px; cursor:pointer;">✏️</button>
              <button onclick="deleteStudent('${s.id}')" style="background:#fee2e2; border:none; padding:4px 8px; border-radius:6px; cursor:pointer;">🗑️</button>
            </div>
          </div>

          <div class="cycle-steps">${stepsHtml}</div>
          ${sessionsDetailsHtml}

          <div class="actions">
            <button class="btn btn-record" onclick="openRecordModal('${s.id}')">+ تسجيل الحصة (${count + 1})</button>
            ${count > 0 ? `
              <button class="btn btn-whatsapp" onclick="sendInvoiceWhatsApp('${s.id}')">📲 إرسال الفاتورة (${count} حصص - ${totalDue} ج)</button>
              <button class="btn btn-reset" onclick="resetCycle('${s.id}')">✓ تم استلام المبلغ (بدء دورة جديدة)</button>
              <button class="btn-undo" onclick="undoLastSession('${s.id}')">تراجع عن آخر حصة</button>
            ` : ''}
          </div>
        `;
        list.appendChild(card);
      });
    }

    function openEditStudentModal(id) {
      const s = students.find(item => item.id === id);
      if (!s) return;
      editingStudentId = id;
      document.getElementById('studentModalTitle').innerText = 'تعديل بيانات الطالب';
      document.getElementById('sName').value = s.name;
      document.getElementById('sGrade').value = s.grade || '';
      document.getElementById('sPhone').value = s.phone || '';
      document.getElementById('sPrice').value = s.defaultPrice || 150;
      openModal('studentModal');
    }

    function openAddStudentModal() {
      editingStudentId = null;
      document.getElementById('studentModalTitle').innerText = 'إضافة طالب جديد';
      document.getElementById('sName').value = '';
      document.getElementById('sGrade').value = '';
      document.getElementById('sPhone').value = '';
      document.getElementById('sPrice').value = '150';
      openModal('studentModal');
    }

    function saveStudent() {
      const name = document.getElementById('sName').value.trim();
      const grade = document.getElementById('sGrade').value.trim();
      const phone = document.getElementById('sPhone').value.trim();
      const price = Number(document.getElementById('sPrice').value) || 150;

      if (!name) { alert('اكتب اسم الطالب'); return; }

      if (editingStudentId) {
        db.collection('students').doc(editingStudentId).update({ name, grade, phone, defaultPrice: price })
          .then(() => closeModal('studentModal'));
      } else {
        const newId = 'std_' + Date.now();
        db.collection('students').doc(newId).set({
          name, grade, phone, defaultPrice: price, sessions: [], history: []
        }).then(() => closeModal('studentModal'));
      }
    }

    function deleteStudent(id) {
      const s = students.find(item => item.id === id);
      if (s && confirm(`حذف الطالب "${s.name}" نهائياً؟ لن تتأثر بيانات أي طالب آخر.`)) {
        db.collection('students').doc(id).delete();
      }
    }

    function openRecordModal(id) {
      activeStudentIdForSession = id;
      const s = students.find(item => item.id === id);
      const nextNum = (s.sessions ? s.sessions.length : 0) + 1;
      document.getElementById('recordModalTitle').innerText = `تسجيل حصة: ${s.name}`;
      document.getElementById('mSessionNum').value = `الحصة رقم (${nextNum})`;
      const now = new Date();
      document.getElementById('mSessionDate').value = now.toISOString().split('T')[0];
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('mStartTime').value = `${h}:${m}`;
      const eh = String((now.getHours() + 1) % 24).padStart(2, '0');
      document.getElementById('mEndTime').value = `${eh}:${m}`;
      document.getElementById('mSessionPrice').value = s.defaultPrice;
      openModal('recordSessionModal');
    }

    function confirmSaveSession() {
      const s = students.find(item => item.id === activeStudentIdForSession);
      if (!s) return;
      const cur = s.sessions || [];
      cur.push({
        num: cur.length + 1,
        date: document.getElementById('mSessionDate').value,
        startTime: document.getElementById('mStartTime').value,
        endTime: document.getElementById('mEndTime').value,
        price: Number(document.getElementById('mSessionPrice').value) || s.defaultPrice
      });
      db.collection('students').doc(activeStudentIdForSession).update({ sessions: cur })
        .then(() => closeModal('recordSessionModal'));
    }

    function undoLastSession(id) {
      const s = students.find(item => item.id === id);
      if (s && s.sessions && s.sessions.length > 0 && confirm('تراجع عن آخر حصة مسجلة؟')) {
        const cur = [...s.sessions];
        cur.pop();
        db.collection('students').doc(id).update({ sessions: cur });
      }
    }

    function resetCycle(id) {
      const s = students.find(item => item.id === id);
      if (!s || !confirm(`تأكيد استلام المبلغ وتصفير العداد لبدء دورة جديدة للطالب "${s.name}"؟ باقي الطلاب لن يتأثروا إطلاقاً.`)) return;
      const hist = s.history || [];
      hist.push({ cycleEndedAt: new Date().toISOString(), sessions: [...(s.sessions || [])] });
      db.collection('students').doc(id).update({ sessions: [], history: hist });
    }

    function sendInvoiceWhatsApp(id) {
      const s = students.find(item => item.id === id);
      if (!s) return;
      let phone = (s.phone || '').trim().replace(/[^0-9]/g, '');
      if (phone.startsWith('002')) phone = phone.substring(2);
      else if (phone.startsWith('0')) phone = '2' + phone;

      let total = 0, details = '';
      s.sessions.forEach(sess => {
        total += Number(sess.price);
        details += `▫️ *الحصة (${sess.num}):* يوم ${formatDateFriendly(sess.date)} (من ${formatTime12h(sess.startTime)} إلى ${formatTime12h(sess.endTime)}) - ${sess.price} ج\n`;
      });

      let pay = '';
      if (paymentInfo.vodafone) pay += `📱 فودافون كاش: ${paymentInfo.vodafone}\n`;
      if (paymentInfo.instapay) pay += `⚡ إنستاباي: ${paymentInfo.instapay}\n`;

      const msg = `السلام عليكم ورحمة الله، ولي أمر الطالب: *${s.name}* 🌸\n\n` +
                  `تم بحمد الله إتمام (${s.sessions.length}) حصص وبيانها كالتالي:\n\n${details}\n` +
                  `💵 *الإجمالي المستحق:* ${total} جنيه.\n\n` +
                  (pay ? `طرق التحويل المتاحة:\n${pay}\n` : '') + `مع خالص التقدير والتمنيات بالتوفيق والنجاح.`;

      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function openPaymentSettings() {
      document.getElementById('cfgVodafone').value = paymentInfo.vodafone || '';
      document.getElementById('cfgInstapay').value = paymentInfo.instapay || '';
      openModal('paymentSettingsModal');
    }

    function savePaymentSettings() {
      const v = document.getElementById('cfgVodafone').value.trim();
      const i = document.getElementById('cfgInstapay').value.trim();
      db.collection('settings').doc('payment').set({ vodafone: v, instapay: i })
        .then(() => { closeModal('paymentSettingsModal'); alert('تم حفظ بيانات الدفع سحابياً بنجاح'); });
    }

    function exportData() {
      const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ students, paymentInfo }));
      const a = document.createElement('a');
      a.href = str;
      a.download = `نسخة_احتياطية_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  </script>
</body>
</html>
